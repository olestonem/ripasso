<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Attività · Pronomi indiretti</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&display=swap" rel="stylesheet"><link rel="stylesheet" href="unified.css"><style>:root{--bg:#f4f5f7;--ink:#18202b;--muted:#687180;--line:#dfe3e8;--yellow-soft:#fff4bf;--green:#dff3e8;--red:#f7dfe0;--shadow:0 18px 45px rgba(24,32,43,.08)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,sans-serif}.page{max-width:980px;margin:auto;padding:24px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:8px 0 22px}.logo{font-weight:800;font-size:20px;text-decoration:none;color:inherit}.nav a{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 14px;font-size:13px;color:var(--muted);font-weight:700;text-decoration:none}.head{margin:24px 0 14px;display:flex;align-items:end;justify-content:space-between;gap:18px}.eyebrow{display:inline-flex;background:var(--yellow-soft);border:1px solid #f0d76b;padding:8px 12px;border-radius:999px;font-size:12px;font-weight:800}.head h1{font-size:clamp(34px,6vw,58px);line-height:.95;letter-spacing:-.055em;margin:16px 0 8px}.head p{margin:0;color:var(--muted);font-size:16px}.progress{min-width:170px;text-align:right;color:var(--muted);font-size:13px;font-weight:800}.bar{height:8px;background:#e8ebef;border-radius:99px;overflow:hidden;margin-top:9px}.fill{height:100%;background:var(--ink);border-radius:99px;transition:width .25s}.exercise-card{background:#fff;border:1px solid var(--line);border-radius:30px;box-shadow:var(--shadow);padding:38px;min-height:390px;display:flex;flex-direction:column}.type-label{font-size:13px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.06em}.question{font-size:clamp(24px,4vw,36px);line-height:1.25;letter-spacing:-.03em;margin:18px 0 25px}.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px}.answer{background:#fff;border:1px solid var(--line);border-radius:17px;padding:17px;text-align:left;font-family:inherit;font-size:18px;font-weight:700;cursor:pointer;min-height:64px;color:var(--ink)}.answer:hover{border-color:#aeb6c2;box-shadow:0 6px 16px #18202b0d}.answer:disabled{cursor:default}.answer.correct{background:var(--green);border-color:#b8ddc8}.answer.wrong{background:var(--red);border-color:#e5b9bb}.feedback{margin-top:20px;border-radius:18px;padding:18px 20px;display:none;line-height:1.5}.feedback.show{display:block}.feedback.good{background:var(--green)}.feedback.bad{background:var(--red)}.feedback strong{display:block;font-size:17px;margin-bottom:5px}.bottom{display:flex;justify-content:space-between;gap:12px;margin-top:18px}.bottom button,.home-btn,.retry{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:13px;padding:13px 18px;font-family:inherit;font-weight:800;cursor:pointer;text-decoration:none;display:inline-block}.bottom button:disabled{opacity:.4;cursor:not-allowed}.end{display:none;text-align:center;padding:45px 20px}.end.show{display:block}.end h2{font-size:40px;margin:0 0 10px}.score{font-size:20px;color:var(--muted);margin-bottom:20px}.home-btn{background:var(--ink);color:white;border-color:var(--ink)}@media(max-width:650px){.page{padding:15px}.exercise-card{padding:24px 18px}.answers{grid-template-columns:1fr}.head{display:block}.progress{text-align:left;margin-top:15px}.bottom{flex-direction:column}.bottom button{width:100%}}</style></head><body><div class="page"><header class="topbar"><a class="logo" href="index.html">Impara giocando</a><nav class="nav"><a href="index.html">← Sezione</a><a href="../index.html">⌂ Home</a></nav></header><main><div class="head"><div><span class="eyebrow" id="eyebrow">Pronomi indiretti · A2–B1</span><h1 id="title">Attività</h1><p id="subtitle">Обери правильний непрямий займенник.</p></div><div class="progress"><span id="progressText">1 / 15</span><div class="bar"><div class="fill" id="fill"></div></div></div></div><section class="exercise-card" id="card"><div class="type-label" id="typeLabel"></div><div id="content"></div><div class="feedback" id="feedback" aria-live="polite"></div><div class="bottom"><button id="prev" type="button">← Indietro</button><button id="next" type="button">Avanti →</button></div></section><section class="end" id="end"><h2>Чудова робота!</h2><div class="score" id="score"></div><div id="summary"></div><p><a class="home-btn" href="index.html">Повернутися до теми</a></p></section></main></div><script src="app.js"></script></body></html>
