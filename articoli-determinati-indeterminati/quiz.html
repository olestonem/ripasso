<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Attività · Gli articoli</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="unified.css"><link rel="stylesheet" href="../global-activity.css">
<style>
:root{--bg:#f4f5f7;--paper:#fff;--ink:#18202b;--muted:#687180;--line:#dfe3e8;--yellow:#ffd84d;--yellow-soft:#fff4bf;--green:#dff3e8;--red:#f7dfe0;--shadow:0 18px 45px rgba(24,32,43,.08)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,sans-serif}
.page{max-width:980px;margin:auto;padding:24px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:8px 0 22px}.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;text-decoration:none;color:inherit}.logo-mark{width:38px;height:38px;border-radius:12px;background:var(--yellow);display:grid;place-items:center;font-size:20px}.nav{display:flex;gap:8px;flex-wrap:wrap}.nav a{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:9px 14px;font-size:13px;color:var(--muted);font-weight:700;text-decoration:none}
.head{margin:24px 0 14px;display:flex;align-items:end;justify-content:space-between;gap:18px}.eyebrow{display:inline-flex;background:var(--yellow-soft);border:1px solid #f0d76b;padding:8px 12px;border-radius:999px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}.head h1{font-size:clamp(34px,5vw,56px);line-height:.98;letter-spacing:-.055em;margin:16px 0 8px}.head p{margin:0;color:var(--muted);font-size:17px}.progress{min-width:170px;text-align:right;color:var(--muted);font-size:13px;font-weight:700;white-space:nowrap}.bar{height:8px;background:#e8ebef;border-radius:99px;overflow:hidden;margin-top:9px}.fill{height:100%;background:var(--ink);border-radius:99px;transition:width .25s}
.card{background:var(--paper);border:1px solid var(--line);border-radius:32px;box-shadow:var(--shadow);padding:42px;min-height:450px;display:flex;flex-direction:column}.type-label{font-size:13px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.06em}.question{font-size:clamp(24px,4vw,38px);line-height:1.2;letter-spacing:-.035em;margin:18px 0 28px}.target{display:inline-block;background:var(--yellow-soft);padding:3px 10px;border-radius:10px}.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px}.answer{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;text-align:left;font-family:inherit;font-size:20px;font-weight:700;cursor:pointer;transition:.15s;min-height:66px;color:var(--ink)}.answer:hover{transform:translateY(-2px);border-color:#b9c0c8}.answer:disabled{cursor:default}.answer.correct{background:var(--green);border-color:#b8ddc8}.answer.wrong{background:var(--red);border-color:#e5b9bb}.feedback{margin-top:22px;border-radius:20px;padding:19px 21px;display:none;line-height:1.5}.feedback.show{display:block}.feedback.good{background:var(--green)}.feedback.bad{background:var(--red)}.feedback strong{display:block;font-size:18px;margin-bottom:5px}.bottom{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:20px}.bottom button{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:14px;padding:13px 18px;font-family:inherit;font-weight:800;cursor:pointer}.bottom button:disabled{opacity:.4;cursor:not-allowed}.end{display:none;text-align:center;padding:50px 20px}.end.show{display:block}.end h2{font-size:clamp(32px,5vw,44px);margin:0 0 12px}.score{font-size:20px;color:var(--muted);margin-bottom:25px}.home-btn{display:inline-flex;background:var(--ink);color:#fff;padding:14px 20px;border-radius:14px;font-weight:800;text-decoration:none}
@media(max-width:650px){.page{padding:15px}.card{padding:25px 18px;min-height:450px}.answers{grid-template-columns:1fr}.head{display:block}.progress{text-align:left;margin-top:16px}.bottom{flex-direction:column}.bottom button{width:100%}}
</style></head>
<body><div class="page">
<header class="topbar"><a class="logo" href="../index.html"><span class="logo-mark">A</span><span>Impara giocando</span></a><nav class="nav"><a href="../index.html">⌂ Home</a><a href="index.html">← Tema principale</a></nav></header>
<main><div class="head"><div><span class="eyebrow" id="eyebrow">Articoli · A0–A1</span><h1 id="title">Gli articoli</h1><p id="subtitle">Вибери правильний варіант.</p></div><div class="progress"><span id="progressText">1 / 15</span><div class="bar"><div class="fill" id="fill"></div></div></div></div>
<section class="card" id="card"><div class="type-label" id="typeLabel"></div><div id="content"></div><div class="feedback" id="feedback"></div><div class="bottom"><button id="prev" type="button">← Indietro</button><button id="next" type="button">Avanti →</button></div></section>
<section class="end" id="end"><h2>Чудова робота!</h2><div class="score" id="score"></div><a class="home-btn" href="index.html">Повернутися до теми</a></section>
</main></div><script src="app.js"></script><script src="score-result.js"></script></body></html>
